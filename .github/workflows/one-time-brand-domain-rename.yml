name: One-time brand/domain rename

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-brand-domain-rename.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename brand and domain references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t files < <(find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.xml' \) \
            ! -path './js/main.js' \
            ! -path './about-us/index.html' \
            ! -path './.git/*')

          if [ "${#files[@]}" -gt 0 ]; then
            perl -0pi -e 's/Surrogacy<span>Expert<\/span>/Surrogate<span>Expert<\/span>/g; s/Surrogacy Expert/Surrogate Expert/g; s/surrogacy\.expert/surrogate.expert/g' "${files[@]}"
          fi

          rm -f .github/workflows/one-time-brand-domain-rename.yml

          echo "Verification after replacement:"
          ! grep -R --include='*.html' --include='*.js' --include='*.xml' -n "Surrogacy Expert" .
          ! grep -R --include='*.html' --include='*.js' --include='*.xml' -n "surrogacy\.expert" .
          grep -R --include='*.html' --include='*.js' --include='*.xml' -n "Surrogate Expert" . | wc -l
          grep -R --include='*.html' --include='*.js' --include='*.xml' -n "surrogate\.expert" . | wc -l

          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rename brand and domain to Surrogate Expert"
            git push
          fi
